config_version = 13

[audio]
sound_volume = 0.099999997764825821

[bar.default]
background_opacity = 0.79999998211860657
center = [ "archbob", "clock", "bar" ]
end = [
    "tray",
    "spacer_3",
    "network_rx",
    "network_tx",
    "group:g2",
    "group:g4",
    "group:g3",
    "spacer_6",
    "battery",
    "session"
]
margin_ends = 50
start = [
    "workspaces",
    "group:g1",
    "spacer_4",
    "launcher",
    "notifications",
    "clipboard",
    "mirror",
    "status",
    "spacer_2",
    "ram",
    "cpu",
    "eyecare-widget"
]
thickness = 28

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = false
    fill = "surface_variant"
    id = "g1"
    members = [ "wallpaper", "settings" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "volume", "widget", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = false
    fill = "surface_variant"
    id = "g3"
    members = [ "control-center" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.bobbyxng]
    color = "primary"
    name = "Google"
    type = "google"

    [calendar.account.mailbox]
    color = "tertiary"
    name = "Mailbox"
    provider = "custom"
    server_url = "https://dav.mailbox.org"
    type = "caldav"
    username = "bxio@mailbox.org"

[control_center]
width = 850

    [control_center.calendar]
    show_week_numbers = true

[dock]
background_opacity = 0.69999998435378075
icon_size = 20
launcher_icon = "assembly-filled"
launcher_position = "start"
radius = 12
radius_top_left = 12
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 1200.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 3600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
auto_locate = true

