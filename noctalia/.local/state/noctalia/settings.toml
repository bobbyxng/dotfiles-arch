config_version = 12

[bar.default]
center = [ "archbob", "clock" ]
end = [ "tray", "spacer_3", "group:g2", "group:g4", "group:g3", "spacer_6", "session" ]
start = [ "workspaces", "group:g1", "spacer_4", "launcher", "clipboard", "mirror", "status", "spacer_2", "ram", "battery" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = false
    fill = "surface_variant"
    id = "g1"
    members = [ "wallpaper", "settings" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "notifications", "control-center" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.bobbyxng]
    color = "primary"
    name = "Google"
    type = "google"

    [calendar.account.mailbox]
    color = "tertiary"
    name = "Mailbox"
    provider = "custom"
    server_url = "https://dav.mailbox.org"
    type = "caldav"
    username = "bxio@mailbox.org"

[control_center]
width = 850

    [control_center.calendar]
    show_week_numbers = true

[dock]
background_opacity = 0.69999998435378075
icon_size = 20
launcher_icon = "assembly-filled"
launcher_position = "start"
radius = 12
radius_top_left = 12
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 180.0

[location]
auto_locate = true

[lockscreen_widgets]
