[plugin_settings."aristides/udiskie"]
manager_open_near_click = true
manager_placement = "attached"

[plugin_settings."cleboost/hotspot"]
password = "12345678"

[plugin_settings."frai3mega/battery-graph"]
battery-panel_open_near_click = true

[plugin_settings."noctalia/bitwarden"]
clear_clipboard_seconds = 10
server_url = "https://vault.bitwarden.eu"

[plugins]
enabled = [
    "noctalia/bitwarden",
    "nightwatch75/file-search",
    "elijaharch/wl-screen-mirror",
    "aristides/udiskie",
    "apex077/eyecare",
    "frai3mega/battery-graph",
    "blackbartblues/audio-switcher",
    "raycursive/discord-voice"
]

[shell]
clipboard_history_max_entries = 20

    [shell.launcher]
    provider_prefix = "#"

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    polkit_placement = "attached"
    transparency_mode = "soft"

[theme]
builtin = "Nord"
community_palette = "Oxocarbon"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "kitty", "niri" ]
    community_ids = [ "discord", "gimp", "neovim", "fastfetch", "yazi" ]

[wallpaper]
directory = "/home/bxiong/Pictures/Wallpapers"
transition = [ "disc", "fade", "zoom" ]
transition_duration = 1000

    [wallpaper.default]
    path = "/home/bxiong/Pictures/Wallpapers/amber-d.jpg"

    [wallpaper.last]
    path = "/home/bxiong/Pictures/Wallpapers/amber-d.jpg"

    [wallpaper.monitors.DP-7]
    path = "/home/bxiong/Pictures/Wallpapers/amber-d.jpg"

    [wallpaper.monitors.DP-8]
    path = "/home/bxiong/Pictures/Wallpapers/amber-d.jpg"

    [wallpaper.monitors.DP-9]
    path = "/home/bxiong/Pictures/Wallpapers/amber-d.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/bxiong/Pictures/Wallpapers/amber-d.jpg"

[widget.archbob]
color = "tertiary"
text = "niribob"
type = "text"

    [widget.archbob.actions]
    left = "panel-toggle control-center notifications"
    middle = "settings-open-widget"
    right = "notification-dnd-toggle"

[widget.bar]
hide_when_disconnected = true
type = "raycursive/discord-voice:bar"

[widget.clipboard.actions]
right = "clipboard-clear"

[widget.clock]
format = "{:%H:%M ∙ %a, %d. %b}"

    [widget.clock.actions]
    right = "exec thunderbird -calendar"

[widget.eyecare-widget]
type = "apex077/eyecare:eyecare-widget"

[widget.media]
enabled = false

[widget.mirror]
type = "elijaharch/wl-screen-mirror:mirror"

[widget.network.actions]
right = "exec nm-connection-editor"

[widget.network_rx]
label_min_width = 42

[widget.network_tx]
label_min_width = 42

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.spacer_6]
type = "spacer"

[widget.status]
hide_when_empty = true
type = "aristides/udiskie:status"

[widget.volume]
mute_color = "tertiary"

[widget.widget]
type = "blackbartblues/audio-switcher:widget"